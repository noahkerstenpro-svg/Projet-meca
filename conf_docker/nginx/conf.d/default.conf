server {
    listen 80;                  # Écoute le port 80
    server_name localhost;      # Nom du serveur

    root /var/www/html;         # Racine des fichiers web
    index /client/accueil.html; # Page d'index par défaut

    # ----------------------------
    # Règle pour toutes les requêtes
    # ----------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        # Essaie le fichier demandé, sinon index.php avec query string
    }

    # ----------------------------
    # Traitement des fichiers PHP via FastCGI
    # ----------------------------
    location ~ \.php$ {
        include fastcgi_params;              # Inclut les paramètres FastCGI standard
        fastcgi_pass php:9000;               # Envoie au service PHP-FPM nommé 'php' sur le port 9000
        fastcgi_index index.php;             # Page par défaut pour PHP
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        # Indique à PHP le chemin complet du script à exécuter
    }

    # ----------------------------
    # Sécurité : empêcher l'accès aux fichiers cachés
    # ----------------------------
    location ~ /\.ht {
        deny all;
    }
}

