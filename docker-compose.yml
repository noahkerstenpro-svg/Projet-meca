version: '3.8'

# ----------------------------
# Réseau interne pour tous les services
# ----------------------------
networks:
  meca-network:
    driver: bridge

# ----------------------------
# Volumes pour persistance MySQL
# ----------------------------
volumes:
  mysqldata:

# ----------------------------
# Définition des services
# ----------------------------
services:

  # ----------------------------
  # PHP-FPM (FastCGI)
  # ----------------------------
  php:
    image: php:8.2-fpm                  # Image officielle PHP avec FPM
    container_name: meca-php
    volumes:
      - ./src:/var/www/html             # Monte ton code local dans le conteneur
    dns:
      - 8.8.8.8                         # DNS pour éviter les problèmes de résolution
      - 1.1.1.1
    networks:
      - meca-network                     # Réseau interne commun pour Nginx

  # ----------------------------
  # Nginx (serveur web)
  # ----------------------------
  nginx:
    image: nginx:stable
    container_name: meca-nginx
    ports:
      - "80:80"                          # Expose le port 80 pour ton navigateur
    volumes:
      - ./src:/var/www/html              # Même code que PHP-FPM
      - ./conf_docker/nginx/conf.d:/etc/nginx/conf.d   # Config Nginx personnalisée
    depends_on:
      - php                               # Nginx démarre après PHP-FPM
    networks:
      - meca-network                     # Même réseau pour communiquer avec PHP-FPM

  # ----------------------------
  # MySQL (base de données)
  # ----------------------------
  mysql:
    image: mysql:8.0
    container_name: meca-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root           # Mot de passe root
      MYSQL_ROOT_HOST: '%'                # Autorise connexions depuis n'importe où
    ports:
      - "3306:3306"                       # Expose MySQL sur ton PC
    volumes:
      - mysqldata:/var/lib/mysql          # Volume pour persister les données
    networks:
      - meca-network

  # ----------------------------
  # PhpMyAdmin (interface web BDD)
  # ----------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: meca-phpmyadmin
    ports:
      - "8080:80"                          # Accessible via http://localhost:8080
    environment:
      PMA_HOST: mysql                      # Nom du service MySQL
      PMA_PORT: 3306
    depends_on:
      - mysql                              # Démarre après MySQL
    networks:
      - meca-network
   HEAD

  # Service Apache + PHP
  web:
    image: php:8.2-apache
    container_name: meca-web
    ports:
      - "8081:80"
    volumes:
      - ./site:/var/www/html
    depends_on:
      - mysql
    networks:
      - meca-network

# Déclaration des volumes Docker
volumes:
  mysqldata:                            # Volume nommé pour stocker les données MySQL

# Déclaration du réseau Docker
networks:
  meca-network:                         # Réseau interne du projet

