<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accueil - Méca Brocéliande</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f1f2f3;
}

/* HEADER */
header {
    background-color: #eb5e00;
    color: white;
    padding: 20px;
    text-align: center;
}

/* text */
.text {
    text-align: center;
    padding: 80px 20px;
}

.text h1 {
    font-size: 80px;
}

.bouton {
    display: inline-block;
    margin-top: 30px;
    padding: 20px 40px;
    background-color: #eb5e00;
    color: white;
    text-decoration: none;
    border-radius: 50px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    transition: background-color 0s;
}

.bouton:hover {
    background-color: #d65300;
}

/* SERVICES */
.services {
    font-size: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    padding: 20px 50px;
    border-radius: 25px;
    width: 250px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1)
}

/* FOOTER */
footer {
    position: fixed;
    bottom: 19px;
    left: 0;
    width: 100%;
    text-align: center;
}
</style>

</head>

<body>

<header>
    <h1>Atelier Mécanique - Bac Professionnel de Brocéliande</h1>
</header>

<section class="text">
    <h1>Bienvenue </h1>
    <p>Réservez votre rendez-vous pour vos réparation</p>
    <a href="connexion.html" class="bouton">S'identifier</a>

</section>

<section class="services">
    <div class="card">
        <h3>Réparation</h3>
        <p>Diagnostic et réparation</p>
    </div>

<div class="card">
    <h3>Entretien</h3>
    <p>Vidange, pneus, freins...</p>
</div>

<div class="card">
    <h3>Prise en charge</h3>
    <p>Rendez-vous rapide</p>
</div>

</section>

<footer>
    <p>© 2026 Méca Brocéliande</p>
</footer>

</body>
</html>
