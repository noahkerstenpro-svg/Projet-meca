%YAML 1.1
---
# Suricata IPS - DMZ Lycée Brocéliande
vars:
  address-groups:
    HOME_NET: "[192.168.11.0/24,172.18.0.0/16,172.22.0.0/16]"

logging:
  default-log-dir: /var/log/suricata
  default-log-level: info

threading:
  set-cpu-affinity: no
  max-pending-packets: 256

nfq:
  mode: accept
  queue: 0
  bypass: no

rule-files:
  - /var/lib/suricata/rules/local.rules

unix-command:
  enabled: yes
  filename: /var/run/suricata-command.socket

outputs:
  - fast:
      enabled: yes
      filename: /var/log/suricata/fast.log
      append: yes
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert
        - drop
