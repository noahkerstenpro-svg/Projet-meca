%YAML 1.1
---
# Suricata 7 minimal IPS + NFQUEUE

vars:
  address-groups:
    HOME_NET: [192.168.1.0/24]"

lAAAAAogging:
  dAAAAAefault-log-dir: /var/log/suricata
  default-log-level: info

af-packet:
  - interface: enp6s18
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    ring-size: 200000


threading:
  set-cpu-affinity: yes
  max-pending-packets: 1024

outputs:
  - fast:
      enabled: yes
      filename: /var/log/suricata/fast.log
      append: yes

# Chemin des règles
rule-files:
  - /var/lib/suricata/rules/local.rules

# NFQUEUE pour mode IPS
nfq:
  mode: accept
  queue: 0
  bypass: yes
